spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # 앱이 시작될 때 미리 생성해 둘 최소 커넥션 개수 (기본값보다 커넥션을 항상 유지함)
      minimum-idle: 2
      # 커넥션이 오랫동안 쉬지 않도록 보조 핑 쿼리 지정 (PostgreSQL, MySQL 등 공통)
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    root: INFO
    io.github.wavesync: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%-5level: [%logger{36}] %msg%n"

storage:
  provider: supabase

supabase:
  url: ${SUPABASE_URL}
  service-key: ${SUPABASE_SERVICE_KEY}
  bucket:
    profiles: profile-images
    weapons: weapon-images
    resonator-thumbnails: resonator-thumbnail-images
    resonator-standings: resonator-standing-images

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # DB 등의 세부 Health Indicator 상태를 실제로 수행하도록 설정
      show-details: always
  # Health Indicator 중 db 체크가 켜져 있는지 확인 (기본적으로 true)
  health:
    db:
      enabled: true
