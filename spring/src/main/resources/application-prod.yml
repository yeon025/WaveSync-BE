spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    root: INFO
    io.github.wavesync: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%-5level: [%logger{36}] %msg%n"

storage:
  provider: supabase

supabase:
  url: ${SUPABASE_URL}
  service-key: ${SUPABASE_SERVICE_KEY}
  bucket:
    profiles: profile-images
    weapons: weapon-images
    resonator-thumbnails: resonator-thumbnail-images
    resonator-standings: resonator-standing-images

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # DB 등의 세부 Health Indicator 상태를 실제로 수행하도록 설정
      show-details: always
  # Health Indicator 중 db 체크가 켜져 있는지 확인 (기본적으로 true)
  health:
    db:
      enabled: true
