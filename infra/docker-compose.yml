services:
  # PostgreSQL 데이터베이스
  postgres:
    image: postgres:17

    # DB 데이터 영구 저장
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d

    # 로컬 접속용 포트
    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: wawu
      POSTGRES_USER: wawu
      POSTGRES_PASSWORD: wawu

      TZ: Asia/Seoul

  # S3 호환 객체 스토리지
  minio:
    image: pgsty/minio:latest

    # API(9000) + 관리자 콘솔(9001)
    command: server /data --console-address ":9001"

    # 이미지 및 파일 영구 저장
    volumes:
      - minio-data:/data

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123

      TZ: Asia/Seoul

  minio-init:
    image: pgsty/mc:latest

    depends_on:
      - minio

    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 admin password123; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;

      mc mb --ignore-existing local/echo-images;

      mc anonymous set download local/echo-images;

      echo 'MinIO initialization complete.';
      "

    restart: "no"

  fastapi:
    build:
      context: ../fastapi
      dockerfile: Dockerfile

    # 개발 시 코드 변경 즉시 반영
    volumes:
      - ../fastapi:/app

    ports:
      - "8000:8000"

    env_file:
      - path: ../fastapi/.env

    # 개발용 자동 리로드
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

    environment:
      # 실행 환경
      APP_ENV: dev

      # PostgreSQL
      DATABASE_URL: postgresql+psycopg2://wawu:wawu@postgres:5432/wawu

      # MinIO 연결 정보
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: http://localhost:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password123

      # 버킷 이름
      MINIO_BUCKET_ECHOES: echo-images

      # Google OAuth (비밀 아닌 고정값만 — Client ID/Secret은 fastapi/.env)
      GOOGLE_OAUTH_REDIRECT_URI: http://localhost:8000/api/auth/google/callback
      GOOGLE_OAUTH_SUCCESS_REDIRECT_URL: http://localhost:3000

      TZ: Asia/Seoul

    # MinIO가 먼저 시작되어야 함
    depends_on:
      - minio
      - minio-init

# 영구 데이터 저장소
volumes:
  postgres-data:
  minio-data:
