services:
  # PostgreSQL 데이터베이스
  postgres:
    image: postgres:17

    # DB 데이터 영구 저장
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d

    # 로컬 접속용 포트
    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: wawu
      POSTGRES_USER: wawu
      POSTGRES_PASSWORD: wawu

  # S3 호환 객체 스토리지
  minio:
    image: minio/minio:latest

    # API(9000) + 관리자 콘솔(9001)
    command: server /data --console-address ":9001"

    # 이미지 및 파일 영구 저장
    volumes:
      - minio-data:/data

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
      
  minio-init:
    image: minio/mc:latest
  
    depends_on:
      - minio
  
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 admin password123; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
  
      mc mb --ignore-existing local/profile-images;
      mc mb --ignore-existing local/echo-images;
      mc mb --ignore-existing local/weapon-images;
      mc mb --ignore-existing local/resonator-thumbnail-images;
      mc mb --ignore-existing local/resonator-standing-images;
  
      mc anonymous set download local/profile-images;
      mc anonymous set download local/echo-images;
      mc anonymous set download local/weapon-images;
      mc anonymous set download local/resonator-thumbnail-images;
      mc anonymous set download local/resonator-standing-images;
  
      echo 'MinIO initialization complete.';
      "
  
    restart: "no"

  # Spring Boot 백엔드
  spring:
    build:
      context: ../spring
      dockerfile: Dockerfile

    # 개발 시 코드 변경 즉시 반영
    volumes:
      - ../spring:/app

    ports:
      - "8080:8080"

    environment:
      # PostgreSQL 연결 정보
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wawu
      SPRING_DATASOURCE_USERNAME: wawu
      SPRING_DATASOURCE_PASSWORD: wawu

      # 실행 프로파일(dev, prod 등)
      SPRING_PROFILES_ACTIVE: dev

      # MinIO 연결 정보
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password123

      # 버킷 이름
      MINIO_BUCKET_PROFILES: profile-images
      MINIO_BUCKET_ECHOES: echo-images
      MINIO_BUCKET_WEAPONS: weapon-images
      MINIO_BUCKET_RESONATOR_THUMBNAILS: resonator-thumbnail-images
      MINIO_BUCKET_RESONATOR_STANDINGS: resonator-standing-images

    # DB 및 MinIO가 먼저 시작되어야 함
    depends_on:
      - postgres
      - minio
      - minio-init

  # 이미지 처리 서버
  fastapi:
    build:
      context: ../fastapi
      dockerfile: Dockerfile

    # 개발 시 코드 변경 즉시 반영
    volumes:
      - ../fastapi:/app
      - C:/Users/user/Downloads:/downloads

    ports:
      - "8000:8000"

    # 개발용 자동 리로드
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

    environment:
      # 실행 환경
      APP_ENV: dev

      # MinIO 연결 정보
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password123

      # 사용 버킷
      MINIO_BUCKET_PROFILES: profile-images
      MINIO_BUCKET_ECHOES: echo-images
      
      # PostgreSQL
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: wawu
      POSTGRES_USER: wawu
      POSTGRES_PASSWORD: wawu

    # MinIO가 먼저 시작되어야 함
    depends_on:
      - minio
      - minio-init

# 영구 데이터 저장소
volumes:
  postgres-data:
  minio-data: